name: Project validation and artifact build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: project-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEC_USER_AGENT: MA-Synergy-Analyzer research contact@users.noreply.github.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python run.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ma-synergy-analyzer-deliverables
          path: |
            output/MA_Synergy_Model.xlsx
            output/MA_Executive_Deck.pptx
            output/executive_deck/evidence_backtest_summary.md
            dashboard/tableau_synergy_data.csv
            dashboard/deal_evidence_backtest.csv
            dashboard/deal_comparability.csv
            research/integration_cost_tracker.csv
            dashboard/financial_due_diligence.csv
            dashboard/microsoft_sec_companyfacts.csv
            dashboard/event_study_results.csv
            data/market_prices.csv
            agent/output/page_chunks.csv
            agent/output/extracted_claims.jsonl
            agent/output/extraction_metrics.csv
          if-no-files-found: ignore
